services:
  - type: web
    name: food-roulette-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m app.ingest && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        sync: false
      - key: FR_CORS_ORIGINS
        value: "*"
